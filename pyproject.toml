[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeui"
version = "0.1.0"
description = "Universal static analysis code intelligence library, defect detector, graph visualizer, and agent context builder"
readme = "README.md"
authors = [
    { name = "Akram Alsubari", email = "akram.alsubari87@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = [
    "code-analysis",
    "static-analysis",
    "code-graph",
    "ast",
    "ai-agents",
    "code-intelligence",
    "llm-context",
    "defect-detection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/AAlsubari/codeUI"
Documentation = "https://github.com/AAlsubari/codeUI#readme"
Repository = "https://github.com/AAlsubari/codeUI.git"
Issues = "https://github.com/AAlsubari/codeUI/issues"

[project.scripts]
codeui = "codeui.cli.main:main"

[project.entry-points."codeui.plugins"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["codeui*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--doctest-modules"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
